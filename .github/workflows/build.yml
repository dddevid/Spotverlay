name: Build and Release Tauri App

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Automatically add macOS targets if on macOS
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Build and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # e.g. v1.0.0
          releaseName: 'Spotverlay ${{ github.ref_name }}'
          releaseBody: |
            Download the correct file for your operating system:
            
            ### 🪟 Windows
            - **`Spotverlay_*_x64-setup.exe`** — Recommended installer
            - **`Spotverlay_*_x64_en-US.msi`** — Alternative MSI installer
            
            ### 🍎 macOS
            - **`Spotverlay_*_aarch64.dmg`** — For modern Apple Silicon (M1/M2/M3) Macs
            - **`Spotverlay_*_x64.dmg`** — For older Intel Macs
            *(Note: `Spotverlay_*.app.tar.gz` files are raw app bundles, usually you just need the `.dmg`)*
            
            ### 🐧 Linux
            - **`spotverlay_*_amd64.deb`** — Debian/Ubuntu installer
            - **`Spotverlay-*-1.x86_64.rpm`** — Fedora/RedHat installer
            - **`Spotverlay_*_amd64.AppImage`** — Universal AppImage for most distros
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
